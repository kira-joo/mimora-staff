name: Verify

on:
  pull_request:
  push:
    branches:
      - staging

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure npm for GitHub Packages
        run: |
          echo "@kira-joo:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_READ_TOKEN }}" >> .npmrc

      - run: npm ci

      - run: npm run typecheck

      # Integration tests need a real replica set (transactions, oversell under contention). The
      # repository's own compose file is the one developers run, so CI cannot drift from it.
      - name: Start the MongoDB replica set
        run: |
          docker compose up -d --wait mongodb
          docker compose up mongodb-init
          for i in $(seq 1 30); do
            docker compose exec -T mongodb mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$' && exit 0
            sleep 2
          done
          echo "replica set never elected a primary" && exit 1

      - run: npm test

      # Every fixture is structurally valid, and the validator is proven able to fail. The CI fixture shop photos live
      # in this repo (scripts/fixtures/images) and are checked here. The mimora `brand/...` images live in the sibling
      # mimora-client repo, which this job does not check out: the check says so, and their existence is proven where
      # both repos are present — seeding reads every file.
      - run: node scripts/fixtures/seed-store.mjs --check --self-test

      - name: Build
        env:
          STAFF_JWT_SECRET: ci-only-secret-not-for-production-use-000000000000
          CUSTOMER_JWT_SECRET: ci-only-customer-secret-not-for-production-0000000
        run: npm run build
